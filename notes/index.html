<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presenter notes</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@700&display=swap">
<style>
/* Presenter view for the iPad. The deck renders in follow mode on top, matching the projector; notes below.
   Open as /notes/?key=KEY. Same tokens as the deck. */
:root{
  --navy:#1e2c55; --orange:#ea993f; --ink:#2d3344; --muted:#5a6377; --line:#dfe3ea;
  --green-ink:#047857; --red-ink:#dc2626;
  --display:'Poppins',Verdana,Geneva,sans-serif; --body:'Montserrat',Verdana,Geneva,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#ffffff;color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
p,h1{margin:0}

#slide{flex:none;width:100%;aspect-ratio:16/9;background:var(--navy);position:relative}
#slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none;background:#ffffff}

#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--orange)}
#top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
#where{font:600 17px/1.3 var(--body);color:var(--muted)}
#status{font:600 15px/1.3 var(--body);color:var(--muted);white-space:nowrap}
#status.live{color:var(--green-ink)}
#status.bad{color:var(--red-ink)}
#title{font:700 24px/1.2 var(--display);color:var(--navy);min-height:1.2em}
#notes{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;font:500 22px/1.5 var(--body);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
#notes.empty{color:var(--muted)}

@media (min-width:1100px) and (orientation:landscape){
  body{flex-direction:row}
  #slide{width:60%;flex:none;align-self:center}
  #panel{height:100%;border-top:0;border-left:3px solid var(--orange);padding:24px 28px calc(24px + env(safe-area-inset-bottom,0px))}
  #title{font-size:30px}
  #notes{font-size:26px}
}
</style>
</head>
<body>
<div id="slide"><iframe id="deck" src="/?follow=1" title="Current slide"></iframe></div>
<section id="panel">
  <div id="top"><p id="where"></p><p id="status"></p></div>
  <h1 id="title"></h1>
  <div id="notes"></div>
</section>
<script>
(function(){
  var q=new URLSearchParams(location.search), key=q.get("key");
  var frame=document.getElementById("deck"), where=document.getElementById("where"), title=document.getElementById("title"),
      notes=document.getElementById("notes"), status=document.getElementById("status");
  var ids=[], stepsOf=[], notesData={}, pos=null, changedAt=0, frameReady=false, inFlight=false, fails=0, live=false;

  function setStatus(cls,text){ status.className=cls; status.textContent=text; }
  if(!key){ setStatus("bad","Add ?key= to the address"); return; }

  fetch("notes.json",{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){ notesData=d||{}; render(); }).catch(function(){});

  frame.addEventListener("load",function(){
    var doc=frame.contentDocument, sl=doc?doc.querySelectorAll(".slide"):[];
    ids=Array.prototype.map.call(sl,function(s){ return s.id; });
    stepsOf=Array.prototype.map.call(sl,function(s){ return +s.getAttribute("data-steps")||0; });
    frameReady=true; push();
  });

  function heading(){
    var doc=frame.contentDocument, s=doc&&doc.querySelector(".slide.active"), h=s&&s.querySelector("h2,h1");
    return h?h.textContent.replace(/\s+/g," ").trim():"";
  }
  function push(){
    if(!frameReady||!pos) return;
    frame.contentWindow.postMessage({cur:pos.cur,step:pos.step},location.origin);
    render();
  }
  /* The deck answers each position message once it has applied it; the heading is read then. */
  window.addEventListener("message",function(e){
    if(e.source===frame.contentWindow&&e.data&&e.data.applied) render();
  });
  function render(){
    if(!pos||!frameReady) return;
    var id=ids[pos.cur]||"", n=stepsOf[pos.cur]||0;
    where.textContent="Slide "+(pos.cur+1)+" of "+ids.length+(n?", click "+pos.step+" of "+n:"");
    title.textContent=heading();
    var t=notesData[id+":"+pos.step]; if(typeof t!=="string") t=notesData[id];
    if(typeof t==="string"&&t.trim()){ notes.textContent=t; notes.classList.remove("empty"); }
    else { notes.textContent="No notes yet"; notes.classList.add("empty"); }
  }
  function age(){ return changedAt?Math.round((Date.now()-changedAt)/1000)+"s":""; }
  function showLive(){ setStatus("live","Live"+(changedAt?" · "+age():"")); }

  function poll(){
    if(inFlight) return; inFlight=true;
    fetch("/.netlify/functions/position?key="+encodeURIComponent(key),{cache:"no-store"}).then(function(r){
      if(r.status===401){ live=false; setStatus("bad","Key rejected"); return null; }
      if(!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function(p){
      if(!p) return;
      fails=0; live=true;
      if(!pos||p.cur!==pos.cur||p.step!==pos.step){ pos={cur:p.cur,step:p.step}; changedAt=Date.now(); push(); }
      showLive();
    }).catch(function(){ if(++fails>=3){ live=false; setStatus("bad","Offline"); } })
      .then(function(){ inFlight=false; });
  }
  poll(); setInterval(poll,400);
  setInterval(function(){ if(live) showLive(); },1000);
})();
</script>
</body>
</html>

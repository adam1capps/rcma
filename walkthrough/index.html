<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get More Info On This!</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@700&display=swap">
<style>
/* Same tokens as the deck (index.html). Phone first: this page opens from a QR scan. */
:root{
  --navy:#1e2c55; --deep:#151f3d; --orange:#ea993f; --ink:#2d3344; --muted:#5a6377;
  --line:#dfe3ea; --red-ink:#dc2626;
  --display:'Poppins',Verdana,Geneva,sans-serif; --body:'Montserrat',Verdana,Geneva,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#ffffff;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
p,h1{margin:0}

header{background:var(--navy);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px;display:flex;justify-content:center}
.logos{display:flex;align-items:center;gap:22px}
.logos img{height:40px;width:auto;display:block}

main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font:700 30px/1.15 var(--display);letter-spacing:-.5px;color:var(--navy)}
.where{font:500 17px/1.4 var(--body);color:var(--muted);margin-top:8px}
.rule{width:56px;height:6px;background:var(--orange);border-radius:3px;margin:18px 0 26px}

form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
label{font:600 15px/1.3 var(--body);color:var(--ink)}
input{width:100%;min-height:52px;padding:0 16px;font:500 16px/1 var(--body);color:var(--ink);background:#ffffff;border:2px solid var(--line);border-radius:12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus-visible{border-color:var(--navy);box-shadow:0 0 0 3px rgba(234,153,63,.45)}
input:user-invalid{border-color:var(--red-ink)}
button{margin-top:8px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--navy);color:#ffffff;font:700 18px/1 var(--display);cursor:pointer}
button:active{background:var(--deep)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}

@media (min-width:700px){
  header{padding-top:28px;padding-bottom:28px}
  .logos img{height:56px}
  main{padding-top:48px}
  h1{font-size:40px}
}
</style>
</head>
<body>
<header>
  <div class="logos"><img src="../img/roofmri-on-navy.png" alt="Roof MRI"><img src="../img/redry-on-navy.png" alt="ReDry"></div>
</header>
<main>
  <h1>Get More Info On This!</h1>
  <p class="where">McCallum High School, Austin, TX</p>
  <div class="rule"></div>

  <form name="walkthrough" method="POST" action="/walkthrough/thanks/" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="walkthrough">
    <p class="trap" aria-hidden="true"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="company">Company</label>
      <input id="company" name="company" type="text" autocomplete="organization" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
    </div>

    <button type="submit">Send request</button>
  </form>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Request sent</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Poppins:wght@700&display=swap">
<style>
:root{
  --navy:#1e2c55; --orange:#ea993f; --ink:#2d3344; --muted:#5a6377;
  --display:'Poppins',Verdana,Geneva,sans-serif; --body:'Montserrat',Verdana,Geneva,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#ffffff;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
p,h1{margin:0}
header{background:var(--navy);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px;display:flex;justify-content:center}
.logos{display:flex;align-items:center;gap:22px}
.logos img{height:40px;width:auto;display:block}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font:700 30px/1.15 var(--display);letter-spacing:-.5px;color:var(--navy)}
.rule{width:56px;height:6px;background:var(--orange);border-radius:3px;margin:18px 0 22px}
.msg{font:500 18px/1.5 var(--body);color:var(--ink)}
@media (min-width:700px){
  header{padding-top:28px;padding-bottom:28px}
  .logos img{height:56px}
  main{padding-top:48px}
  h1{font-size:40px}
}
</style>
</head>
<body>
<header>
  <div class="logos"><img src="../../img/roofmri-on-navy.png" alt="Roof MRI"><img src="../../img/redry-on-navy.png" alt="ReDry"></div>
</header>
<main>
  <h1>Request sent</h1>
  <div class="rule"></div>
  <p class="msg">Adam will be in touch to set up the walk-through.</p>
</main>
</body>
</html>
